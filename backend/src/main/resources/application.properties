# ── Server
server.port=8080
server.servlet.context-path=/api

# ── DataSource (MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/loginapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# ── Rate-limit
app.login.max-attempts=5
app.login.lockout-minutes=15

# ── CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# ── Logging
logging.level.com.loginapp=DEBUG
logging.level.org.springframework.security=WARN
